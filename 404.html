<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Signal Lost | Gregorio Zaltzman D'Ambrosio</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Isolated styling to center the error panel perfectly */
    body { 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        overflow: hidden; 
        background-color: #000000; /* Forces absolute black fallback */
    }

    /* Floating Telemetry Dialog */
    .error-container {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 4rem 3rem;
        max-width: 600px;
        width: 90%;
    }

    .error-label {
        font-family: 'Courier Prime', monospace;
        font-size: 0.85rem;
        color: #ef4444; /* Aerospace warning red */
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 1rem;
    }

    .error-code { 
        font-family: 'Courier Prime', monospace;
        font-size: clamp(6rem, 15vw, 8rem); 
        font-weight: 700;
        color: var(--light); 
        margin-bottom: 1rem; 
        line-height: 1;
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
    }

    .error-msg { 
        font-size: 1.1rem; 
        line-height: 1.7;
        margin-bottom: 3rem; 
        color: var(--muted); 
    }
  </style>
</head>
<body>

  <div class="clean-backdrop"></div>
  <canvas id="space-canvas"></canvas>
  
  <div class="error-container glass-panel chamfer-box dynamic-glow">
    <div class="error-label">[ ERR_SIGNAL_LOST ]</div>
    <div class="error-code">404</div>
    <p class="error-msg">Houston, we have a problem. The orbital trajectory for this page could not be calculated. It may have been jettisoned or never existed.</p>
    <a href="index.html" class="btn chamfer-btn">Re-establish Uplink</a>
  </div>

  <script src="script.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const glowBoxes = document.querySelectorAll('.dynamic-glow');
        glowBoxes.forEach(box => {
            box.addEventListener('mousemove', (e) => {
                const rect = box.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                box.style.setProperty('--mouse-x', `${x}px`);
                box.style.setProperty('--mouse-y', `${y}px`);
            });
        });
    });
  </script>
</body>
</html>
